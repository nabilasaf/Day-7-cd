<!DOCTYPE html>
<html>
<head>
  <title>Formulir Data Diri</title>
  <link rel="stylesheet" href="form.css">
</head>
<body>
  <form>
    <fieldset>
      <legend>Formulir Data Diri</legend>

      <p>Nama: <input type="text" name="nama"></p>
      <p>Alamat: <input type="text" name="alamat"></p>
      <p>Password: <input type="password" name="pass"></p>

      <p>Jenis Kelamin:
        <br>
        <input type="radio" name="jk" value="laki-laki" checked> Laki - Laki
        <input type="radio" name="jk" value="perempuan"> Perempuan
      </p>

      <p>Aktivitas yang dikuasai:
        <br>
        <input type="checkbox" name="main_game"> GAME
        <br>
        <input type="checkbox" name="mendengarkan_musik"> MUSIK
        <br>
        <input type="checkbox" name="membaca"> BACA
      </p>

      <p>Kota asal:
        <select>
          <option>Semarang</option>
          <option>Bandung</option>
          <option>Jakarta</option>
          <option>Yogyakarta</option>
        </select>
      </p>

      <p>Apa Cita-cita Anda:
        <br>
        <textarea rows="4" placeholder="Tulis jawaban Anda di sini"></textarea>
      </p>

      <p><input type="submit" value="Submit"></p>
    </fieldset>
  </form>

  <button class="back"><a href="index.html">Home</a></button>
</body>
</html>
